{% extends 'base.html' %}
{% block body %}


<div class="container my-3">
    <h2>Update Todo</h2>
    <form action="/update/{{ todo.sno }}" method="post">
  <div class="mb-3">
    <label for="text" class="form-label">Add Title</label>
    <input type="text" class="form-control" id="title" aria-describedby="textHelp" name="title" value="{{ todo.title }}">
  </div>
  <div class="mb-3">
    <label for="desc" class="form-label">Todo Description</label>
    <input type="text" class="form-control" id="desc" aria-describedby="descHelp" name="desc" value="{{ todo.desc }}">
  </div>
  <button type="submit" class="btn-solid theme-primary">Submit</button>
</form>
</div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
{% endblock %}

</html>
