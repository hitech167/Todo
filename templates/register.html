{% extends 'base.html' %}
{% block title %}Sign Up | TaskFlow{% endblock %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Get your own private workspace, schedule & smart reminders</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-icon-group">
          <i class="bi bi-person"></i>
          <input type="text" class="form-control" id="username" name="username" placeholder="Choose a unique username" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-icon-group">
          <i class="bi bi-envelope"></i>
          <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-icon-group">
          <i class="bi bi-lock"></i>
          <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <div class="input-icon-group">
          <i class="bi bi-shield-check"></i>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn btn-modern-primary w-100 justify-content-center py-2 mb-3">
        <i class="bi bi-person-check"></i> Complete Registration
      </button>

      <div class="text-center">
        <span class="text-muted small">Already have an account?</span>
        <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none ms-1">Sign in here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
